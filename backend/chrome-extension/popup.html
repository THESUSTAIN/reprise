<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { --navy:#0B1F3A; --gold:#C9A449; --txt:#12233f; --muted:#6b7a90; }
    * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { width: 320px; margin: 0; padding: 14px; color: var(--txt); background: #fff; }
    .head { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .head img { width:26px; height:26px; border-radius:6px; }
    .head b { font-size:14px; color: var(--navy); }
    label { font-size:11px; color: var(--muted); display:block; margin:8px 0 3px; text-transform:uppercase; letter-spacing:.04em; }
    input, textarea { width:100%; border:1px solid #dde3ec; border-radius:8px; padding:8px; font-size:13px; }
    textarea { resize:vertical; min-height:52px; }
    button { width:100%; border:0; border-radius:10px; padding:10px; font-size:13px; font-weight:600; cursor:pointer; margin-top:10px; }
    .primary { background: var(--navy); color:#fff; }
    .ghost { background: #f1f4f9; color: var(--navy); }
    .row { display:flex; gap:8px; }
    .row button { margin-top:0; }
    .note { font-size:11px; color: var(--muted); margin-top:10px; text-align:center; }
    a { color: var(--gold); text-decoration:none; }
  </style>
</head>
<body>
  <div class="head">
    <img src="icon48.png" alt="" />
    <b>MyExtension AI</b>
  </div>

  <label>Nom du prospect</label>
  <input id="name" placeholder="Nom / société" />

  <label>Note / contexte</label>
  <textarea id="note" placeholder="Pourquoi ce lead est intéressant…"></textarea>

  <label>Source (page courante)</label>
  <input id="url" readonly />

  <div class="row">
    <button class="primary" id="send">Ajouter au CRM</button>
    <button class="ghost" id="open">Ouvrir l'app</button>
  </div>

  <p class="note">Connecté à <a href="https://app.zayado.net" target="_blank">app.zayado.net</a></p>

  <script src="popup.js"></script>
</body>
</html>
